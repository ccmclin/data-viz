<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Heat in Maryland</title>
</head>

<body>

    <iframe title="Hot-related deaths in Maryland and Baltimore" aria-label="Grouped Bars" id="datawrapper-chart-LlKN5" src="https://datawrapper.dwcdn.net/LlKN5/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="766" data-external="1"></iframe>

    <br>

    <iframe title="Projected number of extreme heat events in Maryland for the year 2040" aria-label="Choropleth map" id="datawrapper-chart-pFvF3" src="https://datawrapper.dwcdn.net/pFvF3/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="477" data-external="1"></iframe>

    <script type="text/javascript">
    (function(){
        function e(){
            window.addEventListener('message',function(e){
                if(e.data['datawrapper-height']!==void 0){
                    var t=document.querySelectorAll('iframe');
                    for(var n in e.data['datawrapper-height'])
                        for(var r=0,i;i=t[r];r++)
                            if(i.contentWindow===e.source){
                                var a=e.data['datawrapper-height'][n]+'px';
                                i.style.height=a;
                            }
                }
            })
        }
        e()
    })();
    </script>

</body>
</html>
