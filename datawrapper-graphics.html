<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>


  <div style="margin-bottom: 30px;">
    <iframe
      title="Heat-related deaths in Maryland and Baltimore"
      aria-label="Grouped Bars"
      id="datawrapper-chart-LlKN5"
      src="https://datawrapper.dwcdn.net/LlKN5/1/"
      scrolling="no"
      frameborder="0"
      style="width: 0; min-width: 100% !important; border: none;"
      height="766"
      data-external="1">
    </iframe>
  </div>

  <div style="margin-bottom: 30px;">
    <iframe
      title="Projected number of extreme heat events in Maryland for the year 2040"
      aria-label="Choropleth map"
      id="datawrapper-chart-pFvF3"
      src="https://datawrapper.dwcdn.net/pFvF3/1/"
      scrolling="no"
      frameborder="0"
      style="width: 0; min-width: 100% !important; border: none;"
      height="477"
      data-external="1">
    </iframe>
  </div>

  <script type="text/javascript">
    (function() {
      window.addEventListener("message", function(e) {
        if (e.data["datawrapper-height"] !== undefined) {
          var iframes = document.querySelectorAll("iframe");
          for (var chartId in e.data["datawrapper-height"]) {
            for (var i = 0; i < iframes.length; i++) {
              if (iframes[i].contentWindow === e.source) {
                iframes[i].style.height =
                  e.data["datawrapper-height"][chartId] + "px";
              }
            }
          }
        }
      });
    })();
  </script>

</body>
</html>
